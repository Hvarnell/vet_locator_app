# Keeps the Streamlit Community Cloud app awake. The service puts an app to sleep after a stretch with no visitors,
# and the next visitor then sees "Zzzz - this app has gone to sleep" and has to wake it. A real page visit (a
# headless browser that stays on the page for 20 seconds) every 6 hours prevents that. ~4 runs a day, ~2 min each.
name: keep the builder awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page()
              pg.goto("https://vetlocator.streamlit.app/?embed=true", wait_until="domcontentloaded", timeout=120000)
              # if the app is asleep, press the wake button and wait for it to come back
              try:
                  pg.get_by_text("Yes, get this app back up", exact=False).click(timeout=5000)
                  pg.wait_for_timeout(60000)
              except Exception:
                  pass
              pg.wait_for_timeout(20000)
              print("visited:", pg.title())
              b.close()
          EOF
